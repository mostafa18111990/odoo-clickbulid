[options]
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo_pg_pass_2024
db_name = False

; Same dbfilter pattern as the Community container: tenant subdomain → DB name.
; The two containers serve disjoint sets of tenants (sweeper decides which one
; based on tenant.edition) so neither container can accidentally touch the
; other's databases.
dbfilter = ^%d$

admin_passwd = SaaS_Master_2024!
proxy_mode = True
list_db = True

; ── addons paths ─────────────────────────────────────────────────────────────
; Order matters: Odoo searches left-to-right and the first match wins.
;   1. Community core (shipped with the base image)
;   2. Enterprise tree (proprietary, baked into our image at build time)
;   3. Shared addons mount (our saas_* modules + base saas_tenant_manager)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/enterprise,/mnt/extra-addons

; ── workers / limits ─────────────────────────────────────────────────────────
; Enterprise tenants get fewer workers initially because we expect lower count.
; Tune up after we see real load.
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
data_dir = /var/lib/odoo
xmlrpc_port = 8069
longpolling_port = 8072
