[options]
; Render this repository copy with envsubst into a non-tracked runtime file.
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = False
; This limit is per Odoo process. The dedicated cron container overrides it
; with db_maxconn=8 at runtime.
db_maxconn = 12

; Tenant subdomain maps to its database name.
dbfilter = ^%d$

admin_passwd = ${MASTER_PASSWORD}
proxy_mode = True
list_db = False

; Odoo Community core, Enterprise tree, then shared custom addons.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/enterprise,/mnt/extra-addons

; Enterprise web containers never execute scheduled jobs. Dedicated cron
; containers start with --max-cron-threads=1 and --db_maxconn=8.
workers = 2
max_cron_threads = 0
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
data_dir = /var/lib/odoo
xmlrpc_port = 8069
longpolling_port = 8072
