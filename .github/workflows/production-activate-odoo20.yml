name: Activate Odoo 20 for new tenants

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ACTIVATE-ODOO20 to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-odoo20-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Protected production activation
    if: ${{ inputs.confirmation == 'ACTIVATE-ODOO20' }}
    runs-on: [self-hosted, Linux, X64, clickbuild-production]
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate release source
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          test "$(id -un)" = github-runner
          sudo -n -l /usr/local/sbin/clickbuild-odoo20-activate-wrapper >/dev/null
          bash -n scripts/activate_odoo20_new_tenants.sh
          bash -n scripts/install_tenant_provisioner.sh
          bash -n scripts/provision_tenant_cert.sh
          bash -n scripts/patch_nginx_odoo20_upstreams.sh

      - name: Build immutable release archive
        run: |
          set -euo pipefail
          rm -f /tmp/clickbuild-odoo20-release.tar.gz
          tar -czf /tmp/clickbuild-odoo20-release.tar.gz \
            addons docker/odoo20 \
            scripts/install_tenant_provisioner.sh \
            scripts/provision_tenant_cert.sh \
            scripts/patch_nginx_odoo20_upstreams.sh
          sha256sum /tmp/clickbuild-odoo20-release.tar.gz

      - name: Back up, activate, smoke test, or roll back
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/clickbuild-odoo20-activate-wrapper \
            "$GITHUB_WORKSPACE/scripts/activate_odoo20_new_tenants.sh" \
            /tmp/clickbuild-odoo20-release.tar.gz \
            "$GITHUB_SHA"

      - name: Remove temporary release archive
        if: always()
        run: |
          rm -f /tmp/clickbuild-odoo20-release.tar.gz
