name: Staging — Odoo 20 sector bundles

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type TEST-SECTOR-BUNDLES to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-sector-bundles
  cancel-in-progress: false

jobs:
  sector-smoke:
    if: ${{ inputs.confirmation == 'TEST-SECTOR-BUNDLES' }}
    runs-on: [self-hosted, Linux, X64, clickbuild-production]
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Odoo 20 sector application bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = main
          bash -n scripts/smoke_odoo20_sector_bundles.sh
          sudo -n -l /usr/local/sbin/clickbuild-sector-staging-wrapper >/dev/null
          sudo -n /usr/local/sbin/clickbuild-sector-staging-wrapper \
            "$GITHUB_SHA" "$GITHUB_RUN_ID"
