name: Production — credential topology audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT-CREDENTIAL-TOPOLOGY to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-credential-topology-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirmation == 'AUDIT-CREDENTIAL-TOPOLOGY' }}
    runs-on: [self-hosted, Linux, X64, clickbuild-production]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Require protected main branch
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = main
          test "$(id -un)" = github-runner

      - name: Inventory runtime topology without secret values
        run: |
          set -Eeuo pipefail
          bash -n scripts/audit_runtime_credential_topology.sh
          bash scripts/audit_runtime_credential_topology.sh
