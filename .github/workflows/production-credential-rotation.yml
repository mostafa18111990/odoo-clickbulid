name: Production — rotate Odoo credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROTATE-ODOO-CREDENTIALS to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-credential-rotation
  cancel-in-progress: false

jobs:
  rotate:
    if: ${{ inputs.confirmation == 'ROTATE-ODOO-CREDENTIALS' }}
    runs-on: [self-hosted, Linux, X64, clickbuild-production]
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require protected main branch and rehearsed wrapper
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = main
          test "$(id -un)" = github-runner
          sudo -n -l /usr/local/sbin/clickbuild-credential-rotation-production-wrapper >/dev/null
          bash -n scripts/rotate_odoo_runtime_credentials.sh
      - name: Back up, rotate, verify old rejection, or roll back
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/clickbuild-credential-rotation-production-wrapper \
            production "${GITHUB_SHA}" "${GITHUB_RUN_ID}"
