name: ClickBuild SaaS — CI

# CI only. Deployment is intentionally separate and protected.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ODOO_MODULES: >-
    saas_core saas_lifecycle saas_subscription saas_billing saas_payment
    saas_portal saas_website saas_domain_manager saas_notifications
    saas_marketplace saas_reseller saas_support saas_knowledge saas_marketing
    saas_reporting saas_api saas_security saas_ai saas_monitoring

jobs:
  # ════════════════════════════════════════════════════════════════
  # 1. LINT
  # ════════════════════════════════════════════════════════════════
  lint:
    name: Lint (Python + XML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging deployment scripts
        run: |
          bash -n scripts/deploy_saas_website_staging.sh
          bash -n scripts/install_website_staging_wrapper.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install flake8 lxml

      - name: Flake8 (Odoo addons)
        run: |
          flake8 addons/saas_* \
            --max-line-length=120 \
            --ignore=E501,W503,E203,F401,E402 \
            --exclude=__pycache__ \
            --count --statistics || true

      - name: Validate XML well-formedness
        run: |
          python - <<'PY'
          import glob, sys
          from lxml import etree
          errors = 0
          for f in glob.glob("addons/saas_*/**/*.xml", recursive=True):
              try:
                  etree.parse(f)
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  errors += 1
          print(f"Checked XML files. Errors: {errors}")
          sys.exit(1 if errors else 0)
          PY

      - name: Validate manifests
        run: |
          python - <<'PY'
          import glob, ast, sys
          errors = 0
          for f in sorted(glob.glob("addons/saas_*/__manifest__.py")):
              try:
                  data = ast.literal_eval(open(f).read())
                  assert 'name' in data and 'version' in data and 'depends' in data
                  print(f"OK {f} -- {data['name']} v{data['version']}")
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  errors += 1
          sys.exit(1 if errors else 0)
          PY

      - name: Validate Odoo 20 tenant-plane scripts and Compose
        env:
          ODOO20_DB_PASSWORD: validation-only
          ODOO20_MASTER_PASSWORD: validation-only
          ODOO20_ENTERPRISE_PATH: /tmp/enterprise20
          ODOO_NETWORK: validation-network
        run: |
          bash -n scripts/install_tenant_provisioner.sh
          bash -n scripts/activate_odoo20_new_tenants.sh
          bash -n scripts/deploy_sector_catalog_production.sh
          bash -n scripts/install_sector_production_wrapper.sh
          bash -n scripts/provision_tenant_cert.sh
          bash -n scripts/patch_nginx_odoo20_upstreams.sh
          bash -n scripts/saas_backup_all.sh
          bash -n scripts/rotate_odoo_runtime_credentials.sh
          bash -n scripts/clickbuild-credential-rotation-production-wrapper.sh
          bash -n scripts/install_credential_rotation_production_wrapper.sh
          bash -n docker/odoo20/entrypoint.sh
          docker compose \
            -f docker/odoo20/docker-compose.tenants.yml \
            config --quiet
          grep -q "ODOO_VERSION:-20" docker/odoo20/entrypoint.sh
          grep -q "odoo_saas_postgres20" scripts/install_tenant_provisioner.sh
          grep -q '^ODOO_VERSION=20$' scripts/install_tenant_provisioner.sh
          python -c 'from tests.test_no_hardcoded_credentials import test_maintenance_scripts_contain_no_hardcoded_credentials as test; test()'

  # ════════════════════════════════════════════════════════════════
  # 2. SMOKE INSTALL — boots Odoo 20 in a service container and
  # installs the leaf module, which transitively pulls all 19.
  # ════════════════════════════════════════════════════════════════
  smoke-install:
    name: Odoo Smoke Install
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    container:
      image: odoo:20.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          pip install --break-system-packages dnspython paramiko requests || \
          pip install dnspython paramiko requests

      - name: Stage addons
        run: |
          mkdir -p /tmp/extra-addons
          cp -r addons/saas_* /tmp/extra-addons/

      - name: Boot Odoo and install leaf module
        run: |
          odoo \
            --db_host=postgres --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/tmp/extra-addons \
            -d ci_test_db \
            --init=saas_monitoring \
            --without-demo \
            --test-enable --test-tags=/saas_tenant_manager,/saas_core \
            --no-http --stop-after-init 2>&1 | tee odoo_install.log

      - name: Fail on any error in install log
        run: |
          if grep -E "ERROR|CRITICAL|Traceback" odoo_install.log; then
            echo "Install log shows errors"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-install-log
          path: odoo_install.log
