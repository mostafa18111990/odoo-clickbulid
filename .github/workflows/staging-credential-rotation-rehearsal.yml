name: Staging — credential rotation rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REHEARSE-CREDENTIAL-ROTATION to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-credential-rotation-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ inputs.confirmation == 'REHEARSE-CREDENTIAL-ROTATION' }}
    runs-on: [self-hosted, Linux, X64, clickbuild-production]
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require protected main branch and wrapper
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = main
          test "$(id -un)" = github-runner
          sudo -n -l /usr/local/sbin/clickbuild-credential-rotation-production-wrapper >/dev/null
          bash -n scripts/rotate_odoo_runtime_credentials.sh
      - name: Rehearse rotation and rollback in disposable PostgreSQL 15 and 16
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/clickbuild-credential-rotation-production-wrapper \
            rehearse "${GITHUB_SHA}" "${GITHUB_RUN_ID}"
