# Auto-generated tenant server block — DO NOT edit by hand.
# Source template: /opt/odoo-saas/nginx-tenant-template.conf
#
# Placeholders the provisioner replaces:
#   __FQDN__       — full hostname, e.g. acme.odoo.clickbulid.com
#   __BACKEND__    — http upstream block used for /, /web/static, /websocket, /longpolling
#                    community → odoo_backend     (odoo:8069)
#                    enterprise → odoo_ent_backend (odoo_ent:8069)
#   __WEBSOCKET__  — websocket / longpolling upstream
#                    community → odoo_longpolling (odoo:8072)
#                    enterprise → odoo_ent_longpolling (odoo_ent:8072)
server {
    listen 443 ssl http2;
    server_name __FQDN__;

    ssl_certificate     /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 200m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Customers must never reach Odoo's master-password database creator —
    # they sign up through /get-started, get an admin user automatically.
    location ~ ^/web/database/ {
        return 404;
    }

    location /websocket {
        proxy_pass http://__WEBSOCKET__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /longpolling {
        proxy_pass http://__WEBSOCKET__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~* /web/static/ {
        proxy_pass http://__BACKEND__;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://__BACKEND__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_buffering off;
    }
}
